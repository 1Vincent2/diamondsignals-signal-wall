[build]
  command = "python3 scripts/run_admin_green_baseline_from_build.py; python3 dashboard/build_all.py"
  publish = "dist"
  edge_functions = "netlify/request-gates"

[functions]
  included_files = [
    "scripts/**",
    "dashboard/**",
    "dist/status/**"
  ]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "signals-gate"
  path = "/*"

[[redirects]]
  from = "/hidden-gems/"
  to = "/mlb-extraction/"
  status = 301
  force = true

[[redirects]]
  from = "/hidden-gems"
  to = "/mlb-extraction/"
  status = 301
  force = true

# Admin Console truth JSON CORS
[[headers]]
  for = "/dossier_canon.json"
  [headers.values]
    Access-Control-Allow-Origin = "https://app.diamondsignals.ai"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/scout_metrics.json"
