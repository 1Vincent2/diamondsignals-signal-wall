[build]
  command = "python3 scripts/audit_signal_wall_env_boundary.py && python3 scripts/audit_strict_environment_preflight.py && python3 dashboard/build_all.py && python3 scripts/run_admin_green_baseline_from_build.py && python3 scripts/build_admin_audit_manifest.py && python3 scripts/audit_admin_audit_manifest.py && python3 scripts/write_netlify_headers.py && python3 scripts/write_signal_wall_seo_metadata.py && python3 scripts/write_crawl_index_boundaries.py"
  publish = "dist"
  edge_functions = "netlify/request-gates"

[functions]
  included_files = [
    "scripts/**",
    "dashboard/**",
    "dist/status/**"
  ]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "signals-gate"
  path = "/*"


# Retired legacy Signal Wall watch-list. Canonical Tracking Radar lives in the authenticated app.
[[redirects]]
  from = "/watch-list/"
  to = "https://app.diamondsignals.ai/auth?next=/watchlist"
  status = 302
  force = true

[[redirects]]
  from = "/watch-list"
  to = "https://app.diamondsignals.ai/auth?next=/watchlist"
  status = 302
  force = true

[[redirects]]
  from = "/hidden-gems/"
  to = "/mlb-extraction/"
  status = 301
  force = true

[[redirects]]
  from = "/hidden-gems"
  to = "/mlb-extraction/"
  status = 301
  force = true

# Admin Console truth JSON CORS
[[headers]]
  for = "/dossier_canon.json"
  [headers.values]
    Access-Control-Allow-Origin = "https://app.diamondsignals.ai"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/scout_metrics.json"
  [headers.values]
    Access-Control-Allow-Origin = "https://app.diamondsignals.ai"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/player_index.json"
