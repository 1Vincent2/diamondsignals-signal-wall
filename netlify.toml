[build]
  command = "python3 dashboard/build_all.py"
  publish = "dist"
  edge_functions = "netlify/request-gates"

[functions]
  included_files = [
    "scripts/**",
    "dashboard/**",
    "dist/status/**"
  ]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "signals-gate"
  path = "/*"

[[redirects]]
  from = "/hidden-gems/"
  to = "/mlb-extraction/"
  status = 301
  force = true

[[redirects]]
  from = "/hidden-gems"
  to = "/mlb-extraction/"
  status = 301
  force = true
